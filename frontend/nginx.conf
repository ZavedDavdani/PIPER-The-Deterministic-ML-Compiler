# Minimal SPA server config (Batch 4). PIPER's frontend is a
# client-side-routed React app (react-router-dom's BrowserRouter, see
# src/main.tsx) — every path that isn't a real static file must fall
# back to index.html, or a hard refresh on e.g. /runs/abc123 would 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets (Vite's dist/assets/*) — safe to cache
    # aggressively since their filenames change on content change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
